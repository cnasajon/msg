<!-- Favicon: o mesmo desenho de src/components/marca.tsx, o balão de fala com
     três pontos do cabeçalho.

     As cores estão literais aqui, e não como variáveis de tema, porque o
     favicon é carregado fora da página: nenhum token CSS existe neste contexto,
     e uma variável sem valor deixaria o desenho preto. São os tons do tema
     escuro, que é o padrão da aplicação, e o fundo sólido faz o ícone se
     sustentar tanto numa aba clara quanto numa escura. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#4db6ac"/>
  <path d="M11.2 19.6h5.3l-5.1 4.05a.55.55 0 0 1-.9-.43V19.6z" fill="#08211f"/>
  <rect x="7.4" y="8.4" width="17.2" height="11.8" rx="3.6" fill="#08211f"/>
  <circle cx="11.6" cy="14.3" r="1.45" fill="#4db6ac"/>
  <circle cx="16" cy="14.3" r="1.45" fill="#4db6ac"/>
  <circle cx="20.4" cy="14.3" r="1.45" fill="#4db6ac"/>
</svg>
